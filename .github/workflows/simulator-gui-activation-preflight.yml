name: Generic SwiftUI GUI activation preflight

on:
  push:
    branches: [main]
    paths: [.github/workflows/simulator-gui-activation-preflight.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Build and measure generic SwiftUI activation
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          SWIFT_SOURCE = 'import SwiftUI\nimport UIKit\n\n@MainActor\nenum ProbeEvidence {\n    static var checkpoints: [String: Any] = [:]\n    static func mark(_ key: String, values: [String: Any] = [:]) {\n        checkpoints[key] = true\n        checkpoints.merge(values) { _, new in new }\n        checkpoints["preview_flag_present"] = ProcessInfo.processInfo.environment["XCODE_RUNNING_FOR_PREVIEWS"] == "1"\n        checkpoints["probe_flag_present"] = ProcessInfo.processInfo.environment["NATIVE_ACTIVATION_PROBE"] == "1"\n        guard let data = try? JSONSerialization.data(withJSONObject: checkpoints, options: [.sortedKeys, .prettyPrinted]) else { return }\n        let documents = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]\n        try? data.write(to: documents.appendingPathComponent("checkpoints.json"), options: .atomic)\n    }\n}\n\n@main\n@MainActor\nstruct GenericActivationApp: App {\n    init() { ProbeEvidence.mark("app_init") }\n    var body: some Scene {\n        WindowGroup { ActivationView() }\n    }\n}\n\n@MainActor\nstruct ActivationView: View {\n    @Environment(\\.scenePhase) private var scenePhase\n    @State private var ready = false\n\n    var body: some View {\n        VStack(spacing: 20) {\n            Image(systemName: ready ? "checkmark.circle.fill" : "hourglass")\n                .font(.system(size: 64))\n                .foregroundStyle(ready ? Color.green : Color.secondary)\n            Text("SwiftUI activation probe").font(.title2.bold())\n            Text(ready ? "Scene active · foreground key window" : "Waiting for activation")\n                .multilineTextAlignment(.center)\n            Text("Generic lifecycle check").foregroundStyle(.secondary)\n        }\n        .padding(24)\n        .frame(maxWidth: .infinity, maxHeight: .infinity)\n        .background(Color(.systemBackground))\n        .onAppear { ProbeEvidence.mark("on_appear") }\n        .task(id: scenePhase) { @MainActor in\n            ProbeEvidence.mark("task_started", values: ["task_scene_phase": String(describing: scenePhase)])\n            guard ProcessInfo.processInfo.environment["NATIVE_ACTIVATION_PROBE"] == "1" else { return }\n            let phaseActive = scenePhase == .active\n            for attempt in 0..<150 {\n                if Task.isCancelled { return }\n                let activeScenes = UIApplication.shared.connectedScenes.compactMap { $0 as? UIWindowScene }\n                    .filter { $0.activationState == .foregroundActive }\n                let foreground = !activeScenes.isEmpty\n                let keyWindow = activeScenes.contains { $0.windows.contains(where: \\.isKeyWindow) }\n                let passed = phaseActive && foreground && keyWindow\n                ready = passed\n                ProbeEvidence.mark("activation_sampled", values: ["scene_phase_active": phaseActive,\n                    "foreground_active_scene": foreground, "foreground_key_window": keyWindow])\n                let report: [String: Any] = [\n                    "schema_version": 1,\n                    "probe_kind": "generic-swiftui-gui-activation",\n                    "status": passed ? "pass" : "waiting",\n                    "scene_phase_active": phaseActive,\n                    "foreground_active_scene": foreground,\n                    "foreground_key_window": keyWindow,\n                    "probe_flag_present": true,\n                    "preview_flag_present": ProcessInfo.processInfo.environment["XCODE_RUNNING_FOR_PREVIEWS"] == "1",\n                    "poll_attempt": attempt,\n                    "os_version": UIDevice.current.systemVersion\n                ]\n                do {\n                    let data = try JSONSerialization.data(withJSONObject: report, options: [.sortedKeys, .prettyPrinted])\n                    let documents = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]\n                    try data.write(to: documents.appendingPathComponent("activation.json"), options: .atomic)\n                } catch { print("Generic activation report write failed") }\n                if passed { return }\n                do { try await Task.sleep(for: .milliseconds(200)) }\n                catch { return }\n            }\n        }\n    }\n}\n'
          PBX_SOURCE = '// !$*UTF8*$!\n{\n archiveVersion = 1;\n classes = {};\n objectVersion = 56;\n objects = {\n  A00000000000000000000001 = {isa = PBXProject; attributes = {LastUpgradeCheck = 2700;}; buildConfigurationList = A00000000000000000000002; compatibilityVersion = "Xcode 14.0"; developmentRegion = en; hasScannedForEncodings = 0; knownRegions = (en, Base); mainGroup = A00000000000000000000003; productRefGroup = A00000000000000000000004; projectDirPath = ""; projectRoot = ""; targets = (A00000000000000000000005);};\n  A00000000000000000000002 = {isa = XCConfigurationList; buildConfigurations = (A00000000000000000000006); defaultConfigurationIsVisible = 0; defaultConfigurationName = Debug;};\n  A00000000000000000000003 = {isa = PBXGroup; children = (A00000000000000000000007, A00000000000000000000004); sourceTree = "<group>";};\n  A00000000000000000000004 = {isa = PBXGroup; children = (A00000000000000000000008); name = Products; sourceTree = "<group>";};\n  A00000000000000000000005 = {isa = PBXNativeTarget; buildConfigurationList = A00000000000000000000009; buildPhases = (A0000000000000000000000A); buildRules = (); dependencies = (); name = GenericActivation; productName = GenericActivation; productReference = A00000000000000000000008; productType = "com.apple.product-type.application";};\n  A00000000000000000000006 = {isa = XCBuildConfiguration; buildSettings = {CLANG_ENABLE_MODULES = YES; SDKROOT = iphoneos; IPHONEOS_DEPLOYMENT_TARGET = 26.0; SWIFT_VERSION = 6.0;}; name = Debug;};\n  A00000000000000000000007 = {isa = PBXFileReference; lastKnownFileType = sourcecode.swift; path = App.swift; sourceTree = "<group>";};\n  A00000000000000000000008 = {isa = PBXFileReference; explicitFileType = wrapper.application; includeInIndex = 0; path = GenericActivation.app; sourceTree = BUILT_PRODUCTS_DIR;};\n  A00000000000000000000009 = {isa = XCConfigurationList; buildConfigurations = (A0000000000000000000000B); defaultConfigurationIsVisible = 0; defaultConfigurationName = Debug;};\n  A0000000000000000000000A = {isa = PBXSourcesBuildPhase; buildActionMask = 2147483647; files = (A0000000000000000000000C); runOnlyForDeploymentPostprocessing = 0;};\n  A0000000000000000000000B = {isa = XCBuildConfiguration; buildSettings = {PRODUCT_BUNDLE_IDENTIFIER = "org.example.swiftui-gui-activation"; PRODUCT_NAME = "$(TARGET_NAME)"; GENERATE_INFOPLIST_FILE = YES; INFOPLIST_KEY_UIApplicationSceneManifest_Generation = YES; INFOPLIST_KEY_UILaunchScreen_Generation = YES; INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents = YES; TARGETED_DEVICE_FAMILY = "1,2"; SUPPORTED_PLATFORMS = "iphoneos iphonesimulator"; SWIFT_OPTIMIZATION_LEVEL = "-Onone"; CURRENT_PROJECT_VERSION = 1; MARKETING_VERSION = 1.0; CODE_SIGN_STYLE = Manual; CODE_SIGN_IDENTITY = "-"; AD_HOC_CODE_SIGNING_ALLOWED = YES;}; name = Debug;};\n  A0000000000000000000000C = {isa = PBXBuildFile; fileRef = A00000000000000000000007;};\n };\n rootObject = A00000000000000000000001;\n}\n'
          import hashlib, json, os, pathlib, plistlib, shutil, struct, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generic-swiftui-activation'
          root.mkdir(mode=0o700)
          output = root / 'reports'
          output.mkdir()
          state = {'schema_version':1,'probe_kind':'generic-swiftui-gui-activation','status':'preparing','stage':'setup'}
          developer = pathlib.Path('/Applications/Xcode_27.1.app/Contents/Developer')
          device = None
          sequence = 0

          def save():
              (output/'status.json').write_text(json.dumps(state,indent=2,sort_keys=True))

          def run(args, *, timeout=60, check=True, environment=None):
              global sequence
              sequence += 1
              command = list(map(str,args))
              label = str(sequence).zfill(2) + '-' + pathlib.Path(command[0]).name
              try:
                  result = subprocess.run(command,capture_output=True,text=True,timeout=timeout,env=environment)
              except subprocess.TimeoutExpired as error:
                  for suffix,value in [('stdout',error.stdout),('stderr',error.stderr)]:
                      if isinstance(value,bytes): value=value.decode(errors='replace')
                      (output/(label+'-'+suffix+'.txt')).write_text(value or '')
                  raise
              (output/(label+'-stdout.txt')).write_text(result.stdout)
              (output/(label+'-stderr.txt')).write_text(result.stderr)
              if check and result.returncode:
                  raise RuntimeError('generic_command_failed')
              return result

          save()
          try:
              if not developer.is_dir(): raise RuntimeError('required_xcode_unavailable')
              os.environ['DEVELOPER_DIR'] = str(developer)
              state['xcode'] = run(['xcodebuild','-version']).stdout.strip()
              state['sdk_version'] = run(['xcrun','--sdk','iphonesimulator','--show-sdk-version']).stdout.strip()
              if state['sdk_version'] != '27.1': raise RuntimeError('unexpected_simulator_sdk')
              if os.uname().machine != 'arm64': raise RuntimeError('unexpected_runner_architecture')
              runtime_data = json.loads(run(['xcrun','simctl','list','runtimes','--json']).stdout)
              choices = [r for r in runtime_data['runtimes'] if r.get('isAvailable') and r.get('version') == '27.0']
              if not choices: raise RuntimeError('required_runtime_unavailable')
              runtime = choices[0]
              device_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini'
              supported = runtime.get('supportedDeviceTypes')
              if supported and not any(t.get('identifier')==device_type for t in supported): raise RuntimeError('runtime_device_mismatch')
              state.update(runtime=runtime['identifier'],device_type=device_type)
              project = root/'GenericActivation.xcodeproj'
              project.mkdir()
              (project/'project.pbxproj').write_text(PBX_SOURCE)
              schemes=project/'xcshareddata/xcschemes'
              schemes.mkdir(parents=True)
              (schemes/'GenericActivation.xcscheme').write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <Scheme LastUpgradeVersion="2700" version="1.3"><BuildAction parallelizeBuildables="YES" buildImplicitDependencies="YES"><BuildActionEntries><BuildActionEntry buildForTesting="YES" buildForRunning="YES" buildForProfiling="YES" buildForArchiving="YES" buildForAnalyzing="YES"><BuildableReference BuildableIdentifier="primary" BlueprintIdentifier="A00000000000000000000005" BuildableName="GenericActivation.app" BlueprintName="GenericActivation" ReferencedContainer="container:GenericActivation.xcodeproj"/></BuildActionEntry></BuildActionEntries></BuildAction></Scheme>""")
              (root/'App.swift').write_text(SWIFT_SOURCE)
              state['stage']='compile'
              save()
              run(['xcodebuild','build','-project',project,'-scheme','GenericActivation','-configuration','Debug',
                   '-sdk','iphonesimulator','-destination','generic/platform=iOS Simulator',
                   'SYMROOT='+str(root/'build'),'ARCHS=arm64','ONLY_ACTIVE_ARCH=YES',
                   'CODE_SIGNING_ALLOWED=YES','CODE_SIGN_IDENTITY=-','CODE_SIGN_STYLE=Manual',
                   'AD_HOC_CODE_SIGNING_ALLOWED=YES'],timeout=150)
              app=root/'build/Debug-iphonesimulator/GenericActivation.app'
              info=plistlib.loads((app/'Info.plist').read_bytes())
              if not isinstance(info.get('UIApplicationSceneManifest'),dict): raise RuntimeError('generated_scene_manifest_missing')
              state['generated_scene_manifest']=info['UIApplicationSceneManifest']
              run(['codesign','--verify','--deep','--strict',app],timeout=20)
              state['stage']='boot'
              save()
              device=run(['xcrun','simctl','create','GenericSwiftUIActivation',device_type,runtime['identifier']]).stdout.strip()
              state['simulator_id']=device
              run(['xcrun','simctl','boot',device],timeout=30)
              run(['xcrun','simctl','bootstatus',device,'-b'],timeout=600)
              state['stage']='open_gui'
              save()
              run(['open','-a',developer/'Applications/Simulator.app','--args','-CurrentDeviceUDID',device],timeout=30)
              gui=run(['pgrep','-f',str(developer/'Applications/Simulator.app/Contents/MacOS/Simulator')],timeout=10,check=False)
              state['simulator_gui_process_present']=gui.returncode==0
              if not state['simulator_gui_process_present']: raise RuntimeError('simulator_gui_not_running')
              state['stage']='install_launch'
              save()
              run(['xcrun','simctl','install',device,app],timeout=60)
              container=pathlib.Path(run(['xcrun','simctl','get_app_container',device,info['CFBundleIdentifier'],'data'],timeout=20).stdout.strip())
              conditions=('scene_phase_active','foreground_active_scene','foreground_key_window')
              state['cases']=[]
              for preview in (False,True):
                  case='with-preview-flag' if preview else 'without-preview-flag'
                  item={'case':case,'requested_preview_flag':preview,'status':'starting'}
                  state['cases'].append(item)
                  run(['xcrun','simctl','terminate',device,info['CFBundleIdentifier']],timeout=15,check=False)
                  for name in ('activation.json','checkpoints.json'):
                      (container/'Documents'/name).unlink(missing_ok=True)
                  environment=dict(os.environ,SIMCTL_CHILD_NATIVE_ACTIVATION_PROBE='1')
                  environment.pop('SIMCTL_CHILD_XCODE_RUNNING_FOR_PREVIEWS',None)
                  if preview: environment['SIMCTL_CHILD_XCODE_RUNNING_FOR_PREVIEWS']='1'
                  case_start=time.monotonic()
                  launch=run(['xcrun','simctl','launch','--terminate-running-process',device,info['CFBundleIdentifier']],environment=environment,timeout=45,check=False)
                  item['launch_exit']=launch.returncode
                  deadline=time.monotonic()+32
                  observed=None
                  report_file=container/'Documents/activation.json'
                  while launch.returncode==0 and time.monotonic()<deadline:
                      if report_file.is_file():
                          try: observed=json.loads(report_file.read_text())
                          except (ValueError,OSError): pass
                          if observed and observed.get('status')=='pass': break
                      time.sleep(0.2)
                  for name in ('activation.json','checkpoints.json'):
                      source=container/'Documents'/name
                      if source.is_file():
                          shutil.copy2(source,output/(case+'-'+name))
                  checkpoint_file=container/'Documents/checkpoints.json'
                  item['checkpoints']=json.loads(checkpoint_file.read_text()) if checkpoint_file.is_file() else {}
                  item['conditions']={key:observed.get(key) if observed else None for key in conditions}
                  item['status']='pass' if observed and all(observed.get(key) is True for key in conditions) else 'fail'
                  item['elapsed_seconds']=round(time.monotonic()-case_start,3)
                  if observed and (observed.get('probe_flag_present') is not True or observed.get('preview_flag_present') is not preview):
                      item.update(status='fail',error_code='explicit_launch_flag_mismatch')
                  if item['status']=='pass':
                      state['stage']='screenshot'
                      save()
                      time.sleep(1)
                      image=output/('generic-activation-'+case+'.png')
                      run(['xcrun','simctl','io',device,'screenshot','--type=png',image],timeout=30)
                      image_bytes=image.read_bytes()
                      if image_bytes[:8]!=b'\x89PNG\r\n\x1a\n': raise RuntimeError('native_png_missing')
                      width,height=struct.unpack_from('>2I',image_bytes,16)
                      if width<300 or height<600: raise RuntimeError('native_png_dimensions_invalid')
                      item['screenshot']={'file':image.name,'width':width,'height':height,'sha256':hashlib.sha256(image_bytes).hexdigest(),
                          'kind':'generic-native-simulator-screenshot-not-app-evidence'}
                  save()
              state.update(status='pass' if all(item['status']=='pass' for item in state['cases']) else 'fail',stage='complete')
          except Exception as error:
              state.update(status='fail',error_type=type(error).__name__)
              if isinstance(error,RuntimeError): state['error_code']=str(error)
              if device:
                  try: run(['xcrun','simctl','list','devices','--json'],timeout=15,check=False)
                  except Exception: pass
          finally:
              save()
              if device:
                  try: run(['xcrun','simctl','shutdown',device],timeout=15,check=False)
                  except Exception: pass
          print(json.dumps(state,sort_keys=True))
          if state['status']!='pass': raise SystemExit(1)
          PY
      - name: Retain generic activation measurement
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-swiftui-gui-activation
          path: ${{ runner.temp }}/generic-swiftui-activation/reports
          if-no-files-found: error
          retention-days: 3
