name: Private native test launcher

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/private-native-tests.yml
      - .github/scripts/private-runner.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  # Each run has its own authenticated input and isolated runner resources.
  group: private-native-job-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  private-job:
    runs-on: xcode-27
    timeout-minutes: 60
    env:
      PRIVATE_BROKER_URL: https://native-ci-broker.evinsta9.workers.dev
      PRIVATE_JOB_ID: a7ed5577-a3b8-4544-b743-f3f6e23de007
      PRIVATE_SOURCE_SHA256: ce4be6aa4000f35f855240d2cc65c63d3fc359f451493e6bae9c0279d955115d
      PRIVATE_PREFLIGHT_ONLY: 'false'
      PRIVATE_VERIFY_SOURCE: 'false'
    steps:
      - name: Use current stable Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.12.1'
          check-latest: true
          package-manager-cache: false
      - name: Fetch the public launcher at this exact commit
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import os
          from pathlib import Path
          import urllib.request
          location = Path(os.environ['RUNNER_TEMP']) / 'private-native-launcher'
          location.mkdir(mode=0o700)
          source = ('https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY']
                    + '/' + os.environ['GITHUB_SHA'] + '/.github/scripts/private-runner.py')
          with urllib.request.urlopen(source, timeout=30) as response:
              data = response.read(256 * 1024 + 1)
          if not data or len(data) > 256 * 1024:
              raise SystemExit('Public launcher unavailable')
          target = location / 'private-runner.py'
          target.write_bytes(data)
          target.chmod(0o600)
          PY
      - name: Run the authenticated private job
        shell: bash
        run: |
          set -eu
          set -- --broker "$PRIVATE_BROKER_URL" \
            --job "$PRIVATE_JOB_ID" \
            --source-sha256 "$PRIVATE_SOURCE_SHA256"
          if [ "$PRIVATE_PREFLIGHT_ONLY" = 'true' ]; then
            set -- "$@" --verify-access
            if [ "$PRIVATE_VERIFY_SOURCE" = 'true' ]; then
              set -- "$@" --verify-source
            fi
          fi
          python3 "$RUNNER_TEMP/private-native-launcher/private-runner.py" "$@"
