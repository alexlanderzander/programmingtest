# Publish at the existing .github/workflows/private-native-tests.yml only.
# Application sources, signing inputs and results stay in the private broker.
name: Private Atlas release
run-name: private-release-${{ inputs.job_id }}-${{ inputs.source_sha256 }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Private broker job UUID
        required: true
        type: string
      source_sha256:
        description: Exact private source archive SHA256
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: private-native-job-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  private-job:
    runs-on: xcode-27
    timeout-minutes: 80
    env:
      PRIVATE_BROKER_URL: https://native-ci-broker.evinsta9.workers.dev
      PRIVATE_JOB_ID: ${{ inputs.job_id }}
      PRIVATE_SOURCE_SHA256: ${{ inputs.source_sha256 }}
    steps:
      - name: Validate fixed private-job identity
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import os, re, uuid
          job = os.environ['PRIVATE_JOB_ID']
          digest = os.environ['PRIVATE_SOURCE_SHA256']
          try:
              valid_job = str(uuid.UUID(job)) == job
          except ValueError:
              valid_job = False
          if not valid_job or re.fullmatch(r'[0-9a-f]{64}', digest) is None:
              raise SystemExit('Invalid private release identity')
          PY
      - name: Fetch the public launcher at this exact workflow commit
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import os
          from pathlib import Path
          import urllib.request
          location = Path(os.environ['RUNNER_TEMP']) / 'private-native-launcher'
          location.mkdir(mode=0o700)
          source = ('https://raw.githubusercontent.com/' + os.environ['GITHUB_REPOSITORY']
                    + '/' + os.environ['GITHUB_SHA'] + '/.github/scripts/private-runner.py')
          with urllib.request.urlopen(source, timeout=30) as response:
              data = response.read(256 * 1024 + 1)
          if not data or len(data) > 256 * 1024:
              raise SystemExit('Public launcher unavailable')
          target = location / 'private-runner.py'
          target.write_bytes(data)
          target.chmod(0o600)
          PY
      - name: Run the authenticated private release
        shell: bash
        run: |
          set -eu
          python3 "$RUNNER_TEMP/private-native-launcher/private-runner.py" \
            --broker "$PRIVATE_BROKER_URL" --job "$PRIVATE_JOB_ID" \
            --source-sha256 "$PRIVATE_SOURCE_SHA256" \
            --device-archive-budget --timeout-seconds 4200
