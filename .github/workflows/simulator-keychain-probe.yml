name: Generic simulator Keychain signing probe

on:
  push:
    branches: [main]
    paths: [.github/workflows/simulator-keychain-probe.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - name: Measure simulator Keychain status for generic signing variants
        shell: bash
        run: |
          set -eu
          python3 - <<'PY'
          import json, os, pathlib, plistlib, shutil, subprocess, time
          root = pathlib.Path(os.environ['RUNNER_TEMP']) / 'generic-keychain-probe'
          root.mkdir(mode=0o700)
          output = root / 'reports'
          output.mkdir()
          developer = pathlib.Path('/Applications/Xcode_27.1.app/Contents/Developer')
          if not developer.is_dir():
              raise SystemExit('Required Xcode 27.1 is not installed')
          os.environ['DEVELOPER_DIR'] = str(developer)

          def run(args, *, timeout=60, check=True):
              command = list(map(str, args))
              try:
                  result = subprocess.run(command, capture_output=True, text=True, timeout=timeout)
              except subprocess.TimeoutExpired as error:
                  if command[:3] == ['xcrun','simctl','bootstatus']:
                      for label, value in [('stdout',error.stdout),('stderr',error.stderr)]:
                          if isinstance(value,bytes): value = value.decode(errors='replace')
                          (output/('boot-timeout-'+label+'.txt')).write_text(value or '')
                      try:
                          state = subprocess.run(['xcrun','simctl','list','devices','--json'],
                              capture_output=True,text=True,timeout=30)
                          (output/'boot-timeout-simulator-state.json').write_text(state.stdout)
                          (output/'boot-timeout-state-stderr.txt').write_text(state.stderr)
                      except Exception:
                          (output/'boot-timeout-state-stderr.txt').write_text('Simulator state query did not complete')
                  raise
              if check and result.returncode:
                  raise RuntimeError('Generic probe command failed: ' + ' '.join(map(str,args)) + '\n' + result.stderr[-3000:])
              return result

          sdk = run(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-path']).stdout.strip()
          sdk_version = run(['xcrun', '--sdk', 'iphonesimulator', '--show-sdk-version']).stdout.strip()
          if not sdk_version.startswith('27.1'):
              raise SystemExit('Simulator SDK does not match the required 27.1 series')
          arch = run(['uname','-m']).stdout.strip()
          if arch != 'arm64':
              raise SystemExit('Expected the standard Apple Silicon runner')
          device_type = 'com.apple.CoreSimulator.SimDeviceType.iPhone-13-mini'
          runtimes = json.loads(run(['xcrun','simctl','list','runtimes','--json']).stdout)['runtimes']
          choices = [r for r in runtimes if r.get('isAvailable') and r.get('version') == '27.0']
          if not choices:
              raise SystemExit('The required installed iOS 27.0 runtime is unavailable')
          runtime = choices[0]
          supported = runtime.get('supportedDeviceTypes')
          if supported and not any(d.get('identifier') == device_type for d in supported):
              raise SystemExit('The runtime does not support iPhone 13 mini')

          swift = root / 'Probe.swift'
          swift.write_text(r'''
          import UIKit
          import Security
          import Foundation

          @main
          @MainActor
          final class ProbeApp: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication,
                  didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let controller = UIViewController()
                  controller.view.backgroundColor = .systemBackground
                  let label = UILabel()
                  label.text = "Generic Keychain probe"
                  label.translatesAutoresizingMaskIntoConstraints = false
                  controller.view.addSubview(label)
                  NSLayoutConstraint.activate([
                      label.centerXAnchor.constraint(equalTo: controller.view.centerXAnchor),
                      label.centerYAnchor.constraint(equalTo: controller.view.centerYAnchor)
                  ])
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  window.rootViewController = controller
                  window.makeKeyAndVisible()
                  self.window = window
                  DispatchQueue.main.asyncAfter(deadline: .now() + 0.5) { self.measure() }
                  return true
              }

              private func status(_ value: OSStatus) -> [String: Any] {
                  ["status": Int(value), "message": SecCopyErrorMessageString(value, nil) as String? ?? ""]
              }

              private func check(group: String?) -> [String: Any] {
                  let bundle = Bundle.main.bundleIdentifier ?? "unknown"
                  var query: [String: Any] = [
                      kSecClass as String: kSecClassGenericPassword,
                      kSecAttrService as String: "org.example.native-keychain-probe",
                      kSecAttrAccount as String: bundle + (group == nil ? ".default" : ".explicit")
                  ]
                  if let group { query[kSecAttrAccessGroup as String] = group }
                  let first = Data("public-non-secret-sentinel-one".utf8)
                  let second = Data("public-non-secret-sentinel-two".utf8)
                  var report: [String: Any] = [:]
                  report["delete_before"] = status(SecItemDelete(query as CFDictionary))
                  report["update_before_add"] = status(SecItemUpdate(query as CFDictionary,
                      [kSecValueData as String: first,
                       kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly] as CFDictionary))
                  var add = query
                  add[kSecValueData as String] = first
                  add[kSecAttrAccessible as String] = kSecAttrAccessibleWhenUnlockedThisDeviceOnly
                  report["add"] = status(SecItemAdd(add as CFDictionary, nil))
                  var read = query
                  read[kSecReturnData as String] = true
                  read[kSecMatchLimit as String] = kSecMatchLimitOne
                  var value: CFTypeRef?
                  report["read"] = status(SecItemCopyMatching(read as CFDictionary, &value))
                  report["read_matches"] = (value as? Data) == first
                  report["update_existing"] = status(SecItemUpdate(query as CFDictionary,
                      [kSecValueData as String: second,
                       kSecAttrAccessible as String: kSecAttrAccessibleWhenUnlockedThisDeviceOnly] as CFDictionary))
                  value = nil
                  report["read_updated"] = status(SecItemCopyMatching(read as CFDictionary, &value))
                  report["updated_matches"] = (value as? Data) == second
                  report["delete_after"] = status(SecItemDelete(query as CFDictionary))
                  return report
              }

              private func measure() {
                  let group = Bundle.main.object(forInfoDictionaryKey: "ProbeAccessGroup") as? String ?? ""
                  let report: [String: Any] = [
                      "schema_version": 1,
                      "probe_kind": "generic-keychain-signing-comparison",
                      "accessibility": "kSecAttrAccessibleWhenUnlockedThisDeviceOnly",
                      "bundle_id": Bundle.main.bundleIdentifier ?? "unknown",
                      "variant": Bundle.main.object(forInfoDictionaryKey: "ProbeVariant") as? String ?? "unknown",
                      "os_version": UIDevice.current.systemVersion,
                      "simulator_model": ProcessInfo.processInfo.environment["SIMULATOR_MODEL_IDENTIFIER"] ?? "unknown",
                      "default_access_group": check(group: nil),
                      "explicit_access_group": check(group: group)
                  ]
                  do {
                      let data = try JSONSerialization.data(withJSONObject: report, options: [.sortedKeys, .prettyPrinted])
                      let directory = FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      try data.write(to: directory.appendingPathComponent("probe.json"), options: .atomic)
                  } catch { print("Generic probe could not write its result") }
              }
          }
          ''')
          binary = root / 'Probe'
          compile_result = run(['xcrun','--sdk','iphonesimulator','swiftc','-sdk',sdk,
              '-target','arm64-apple-ios26.0-simulator','-swift-version','6','-parse-as-library',
              swift,'-framework','UIKit','-framework','Security','-o',binary], timeout=120)
          (output / 'compiler.txt').write_text(compile_result.stdout + compile_result.stderr)
          device = run(['xcrun','simctl','create','GenericKeychainProbe',device_type,runtime['identifier']]).stdout.strip()
          reports = {'schema_version':1, 'probe_kind':'generic-keychain-signing-comparison',
              'sdk':sdk_version,'runtime':runtime['identifier'],'device_type':device_type,
              'xcode':run(['xcodebuild','-version']).stdout.strip(),'variants':[]}
          def save_reports():
              (output/'comparison.json').write_text(json.dumps(reports,indent=2,sort_keys=True))
          save_reports()
          try:
              run(['xcrun','simctl','boot',device])
              run(['xcrun','simctl','bootstatus',device,'-b'],timeout=600)
              for variant in ['adhoc-with-entitlements','adhoc-no-entitlements','linker-default','unsigned']:
                  bundle_id = 'org.example.native-keychain-probe.' + variant
                  app = root / (variant + '.app')
                  item = {'variant':variant,'stage':'prepare'}
                  reports['variants'].append(item)
                  save_reports()
                  try:
                      app.mkdir()
                      shutil.copy2(binary,app/'Probe')
                      group = 'TEST000000.' + bundle_id
                      info = {'CFBundleIdentifier':bundle_id,'CFBundleExecutable':'Probe',
                          'CFBundleName':'Generic Keychain Probe','CFBundlePackageType':'APPL',
                          'CFBundleVersion':'1','CFBundleShortVersionString':'1.0',
                          'CFBundleSupportedPlatforms':['iPhoneSimulator'],'MinimumOSVersion':'26.0',
                          'UIDeviceFamily':[1,2],'UILaunchScreen':{},
                          'UISupportedInterfaceOrientations':['UIInterfaceOrientationPortrait'],
                          'ProbeVariant':variant,'ProbeAccessGroup':group}
                      (app/'Info.plist').write_bytes(plistlib.dumps(info))
                      item['stage'] = 'sign'
                      if variant == 'unsigned':
                          run(['codesign','--remove-signature',app/'Probe'],check=False)
                      elif variant.startswith('adhoc-'):
                          command = ['codesign','--force','--sign','-','--timestamp=none','--identifier',bundle_id]
                          if variant == 'adhoc-with-entitlements':
                              entitlements = root / 'entitlements.plist'
                              entitlements.write_bytes(plistlib.dumps({
                                  'application-identifier':group,
                                  'com.apple.developer.team-identifier':'TEST000000',
                                  'keychain-access-groups':[group], 'get-task-allow':True}))
                              command += ['--entitlements',entitlements,'--generate-entitlement-der']
                          run([*command,app])
                      signing = run(['codesign','--display','--verbose=4',app],check=False)
                      verify = run(['codesign','--verify','--strict','--verbose=4',app],check=False)
                      entitlements = run(['codesign','--display','--entitlements','-','--xml',app],check=False)
                      (output/(variant+'-signing.txt')).write_text(signing.stdout+signing.stderr+verify.stdout+verify.stderr)
                      (output/(variant+'-entitlements.xml')).write_text(entitlements.stdout)
                      observed_entitlements = None
                      if entitlements.stdout.strip():
                          try: observed_entitlements = plistlib.loads(entitlements.stdout.encode())
                          except Exception: pass
                      item.update(codesign_display_exit=signing.returncode,codesign_verify_exit=verify.returncode,
                          observed_entitlements=observed_entitlements,
                          signature_state='missing' if signing.returncode else 'verified' if verify.returncode==0 else 'invalid_or_unbound')
                      if variant.startswith('adhoc-') and verify.returncode:
                          item['error'] = 'expected_ad_hoc_bundle_signature_invalid'
                          continue
                      save_reports()
                      item['stage'] = 'install'
                      install = run(['xcrun','simctl','install',device,app],timeout=90,check=False)
                      item['install_exit'] = install.returncode
                      if install.returncode:
                          item['error'] = 'installation_failed'
                          item['diagnostic'] = install.stderr[-1500:]
                          continue
                      item['stage'] = 'launch'
                      launch = run(['xcrun','simctl','launch','--terminate-running-process',device,bundle_id],timeout=90,check=False)
                      item['launch_exit'] = launch.returncode
                      if launch.returncode:
                          item['error'] = 'launch_failed'
                          item['diagnostic'] = launch.stderr[-1500:]
                          continue
                      item['stage'] = 'read_result'
                      container = pathlib.Path(run(['xcrun','simctl','get_app_container',device,bundle_id,'data']).stdout.strip())
                      result_path = container/'Documents/probe.json'
                      deadline = time.monotonic()+20
                      while not result_path.is_file() and time.monotonic()<deadline: time.sleep(.2)
                      if result_path.is_file():
                          item['measurement'] = json.loads(result_path.read_text())
                          shutil.copyfile(result_path,output/(variant+'.json'))
                          item['stage'] = 'measured'
                      else: item['error'] = 'result_not_written'
                  except subprocess.TimeoutExpired as error:
                      item['error'] = 'command_timeout'
                      item['timeout_seconds'] = error.timeout
                  except Exception as error:
                      item['error'] = type(error).__name__
                      item['diagnostic'] = str(error)[-1500:]
                  finally:
                      save_reports()
                      for operation in ['terminate','uninstall']:
                          try: run(['xcrun','simctl',operation,device,bundle_id],timeout=15,check=False)
                          except Exception: item['cleanup_incomplete'] = True
                      save_reports()
              print('GENERIC_KEYCHAIN_PROBE_JSON_BEGIN')
              print(json.dumps(reports,indent=2,sort_keys=True))
              print('GENERIC_KEYCHAIN_PROBE_JSON_END')
              if not any('measurement' in item for item in reports['variants']):
                  raise SystemExit('No variant produced an actual simulator measurement')
          finally:
              run(['xcrun','simctl','shutdown',device],check=False)
              run(['xcrun','simctl','delete',device],check=False)
          PY
      - name: Preserve generic non-secret measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: generic-simulator-keychain-probe
          path: ${{ runner.temp }}/generic-keychain-probe/reports/
          retention-days: 1
          if-no-files-found: error
